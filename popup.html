<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mix Shuffler</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="eyebrow">YOUTUBE MIX 1.0.0</div>
    <h1>Better Shuffler</h1>
    <p class="desc">Keep the songs you already like, add desired recommendations, then randomize the order.</p>

    <button id="shuffle">Shuffle this mix</button>
    <button id="stop" class="secondary">Stop shuffle</button>

    <div id="status" class="status idle">Ready — open a YouTube video first.</div>
    <div id="stats" class="stats"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
